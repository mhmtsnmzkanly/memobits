[package]
name = "memobits-cli"
version = "0.1.0"
edition = "2021"

[features]
default = ["wasmtime"]
wasmtime = ["memobits-runtime/wasmtime"]

[[bin]]
name = "mb"
path = "src/main.rs"

[dependencies]
memobits-project = { path = "../memobits-project" }
memobits-diagnostics = { path = "../memobits-diagnostics" }
memobits-syntax = { path = "../memobits-syntax" }
memobits-resolve = { path = "../memobits-resolve" }
memobits-analysis = { path = "../memobits-analysis" }
memobits-ownership = { path = "../memobits-ownership" }
memobits-wasm = { path = "../memobits-wasm" }
memobits-ir = { path = "../memobits-ir" }
memobits-runtime = { path = "../memobits-runtime" }
wasm-encoder = "0.263.0"
wasmparser = "0.263.0"

[dev-dependencies]
wasmtime = { version = "38.0.4", default-features = false, features = ["cranelift", "runtime", "std", "component-model"] }
wit-parser = "0.239.0"
