[workspace]
members = ["crates/*"]
exclude = ["legacy"]
resolver = "2"

# The guest runtime interprets every test program; an unoptimized interpreter
# makes the float-formatting tables (thousands of formatted values) take
# minutes. Optimize only the interpreter crates.
[profile.dev.package.wasmi]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.wasmi_core]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.wasmi_ir]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.wasmi_collections]
opt-level = 3
debug-assertions = false
overflow-checks = false
